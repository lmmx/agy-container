# Hardened sshd configuration for agy-container git-gateway sidecar.
# Listens on unprivileged port 2222 so CAP_NET_BIND_SERVICE is not required.

Port 2222
ListenAddress 0.0.0.0
HostKey /run/secrets/host_key

AllowUsers gitgw
PermitRootLogin no
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile /run/secrets/authorized_keys

ForceCommand /usr/local/bin/git-policy
PermitTTY no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
PermitOpen none
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
PermitUserRC no
Subsystem sftp /bin/false

StrictModes no
UseDNS no
LogLevel INFO
PidFile /run/sshd.pid
